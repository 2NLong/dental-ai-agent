version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dental-qdrant
    ports:
      - "6333:6333" # REST API & Web UI (Dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
